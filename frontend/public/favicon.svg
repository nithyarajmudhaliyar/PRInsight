<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0B1628"/>
  <!-- Magnifying glass -->
  <circle cx="14" cy="14" r="8" stroke="#3B82F6" stroke-width="2" fill="none"/>
  <line x1="20" y1="20" x2="27" y2="27" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Circuit nodes -->
  <circle cx="3" cy="10" r="1.5" fill="#1E88E5"/>
  <line x1="4.5" y1="10" x2="7" y2="14" stroke="#1E88E5" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="3" cy="18" r="1.5" fill="#1E88E5"/>
  <line x1="4.5" y1="18" x2="7" y2="14" stroke="#1E88E5" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Merge arrow inside glass -->
  <path d="M10 14 L18 14" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M10 11 L14 14 L10 17" stroke="#E53935" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
