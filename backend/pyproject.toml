[project]
name = "prinsight-backend"
version = "0.1.0"
description = "PRInsight — Detect merge conflicts before they happen."
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.138.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings>=2.9.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
